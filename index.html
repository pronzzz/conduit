<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Conduit: a deterministic, real-time playground for distributed system design." />
    <meta name="theme-color" content="#0c0c0d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Conduit</title>
    <script>
      // Pick the theme before first paint to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem('conduit:v1') || '{}').theme;
        var theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.background = theme === 'light' ? '#f6f6f4' : '#0c0c0d';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
